
name: PrimeNet VPN Setup

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    name: Generate Flutter Android Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter Project
        run: |
          flutter create \
            --platforms=android \
            --project-name primenet_vpn \
            --org com.primenetvpn \
            .

      - name: Save Flutter Project Structure
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Initialize PrimeNet VPN Flutter Android project"

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart Code
        run: flutter analyze

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrimeNet-VPN-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
